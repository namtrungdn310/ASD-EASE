[platformio]
default_envs = conservative_esp32s3

[env:conservative_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D FIRMWARE_VERSION=\"0.1.0\"
; Temporary generic build profile only. Physical board identity, flash,
; PSRAM and GPIO configuration remain unverified. Firmware does not require PSRAM.

