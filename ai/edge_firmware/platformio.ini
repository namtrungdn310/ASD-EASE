[platformio]
; HR đang được đánh giá trên cổ tay; giữ cấu hình LED/lấy mẫu hiện tại, FIFO50Hz.
default_envs = esp32s3_supermini

[env:esp32s3_supermini]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600

board_build.flash_size = 4MB
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    Wire

[env:esp32s3_network_check]
extends = env:esp32s3_supermini
build_flags =
    ${env:esp32s3_supermini.build_flags}
    -D ASD_NETWORK_ENABLED=1
    -D ASD_NETWORK_BUILD_CHECK=1


[env:esp32s3_serial_check]
extends = env:esp32s3_supermini
build_flags =
    ${env:esp32s3_supermini.build_flags}
    -D ASD_NETWORK_ENABLED=0
    -D ASD_NETWORK_BUILD_CHECK=1

; Giữ tên env cho lệnh cũ; cùng HR với bản mặc định, không phải thuật toán thứ hai.
[env:esp32s3_hr_tracker]
extends = env:esp32s3_supermini
