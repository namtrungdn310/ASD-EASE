## Mosquitto configuration — LOCAL DEVELOPMENT ONLY
## NOT suitable for production/public deployment.

# Network
listener 1883
protocol mqtt

# Authentication — require username/password
allow_anonymous false
password_file /mosquitto/config/password.txt

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
